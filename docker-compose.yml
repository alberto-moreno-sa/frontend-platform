services:
  # ── Frontend ──────────────────────────────────────────────
  analytics-demo:
    build:
      context: .
      dockerfile: analytics-demo/Dockerfile
    ports:
      - "${ANALYTICS_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - auth-service
      - tracking-service
    restart: unless-stopped

  # ── Backend services ──────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_PORT:-3001}:3001"
    env_file:
      - ./services/auth-service/.env
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  tracking-service:
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    ports:
      - "${TRACKING_PORT:-3002}:3002"
    env_file:
      - ./services/tracking-service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      - auth-service
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    profiles:
      - local-db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:

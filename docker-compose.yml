services:
  # ── Frontend ──────────────────────────────────────────────
  analytics-dashboard:
    build:
      context: .
      dockerfile: analytics-dashboard/Dockerfile
    ports:
      - "${ANALYTICS_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - TRACKING_SERVICE_URL=http://tracking-service:3002
      - TRACKING_SERVICE_PUBLIC_URL=http://localhost:${TRACKING_PORT:-3002}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
    depends_on:
      auth-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend services ──────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_PORT:-3001}:3001"
    env_file:
      - ./services/auth-service/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:${ANALYTICS_PORT:-3000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  tracking-service:
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    ports:
      - "${TRACKING_PORT:-3002}:3002"
    env_file:
      - ./services/tracking-service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - ALLOWED_ORIGINS=http://localhost:${ANALYTICS_PORT:-3000}
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    profiles:
      - with-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=tracking-local-dev-001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    profiles:
      - local-db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
